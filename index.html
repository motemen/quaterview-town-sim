<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>箱庭都市</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="minimap" title="クリックで移動 (M で表示切替)"></canvas>
    <div id="tile-info" hidden></div>
    <div id="hud">
      <span class="status">
        <span id="hud-town"></span>
        <span id="hud-date"></span>
        <span id="hud-clock"></span>
        <span id="hud-pop"></span>
      </span>
      <span class="spacer"></span>
      <span id="hud-news"></span>
      <span class="buttons">
        <button id="btn-speed" title="速度 (クリックで切替 / スペース・1・2・3)">▶</button>
        <button data-jump="30" title="1か月進める (J)">+1月</button>
        <button data-jump="360" title="1年進める (L)">+1年</button>
        <button id="btn-map" class="active" title="ミニマップ (M)">▦</button>
        <button id="btn-sound" title="環境音">♪</button>
        <button id="btn-shot" title="スクリーンショット (P)">📷</button>
        <button id="btn-rec" title="録画 (R)">⏺</button>
        <button id="btn-reset" title="新しい街を始める">↺</button>
      </span>
    </div>
    <div id="help" hidden>
      <h2>操作</h2>
      <table>
        <tr><td>ドラッグ / 矢印 / WASD</td><td>カメラ移動</td></tr>
        <tr><td>ホイール / + / -</td><td>ズーム</td></tr>
        <tr><td>スペース</td><td>一時停止</td></tr>
        <tr><td>1 / 2 / 3</td><td>速度 ▶ / ▶▶ / ▶▶▶</td></tr>
        <tr><td>J / Shift+J / L</td><td>1か月 / 3か月 / 1年 進める</td></tr>
        <tr><td>↺</td><td>新しい街を始める</td></tr>
        <tr><td>M</td><td>ミニマップ表示切替</td></tr>
        <tr><td>P</td><td>スクリーンショットを保存</td></tr>
        <tr><td>R</td><td>録画の開始 / 停止 (最長 2 分)</td></tr>
        <tr><td>ピンチ</td><td>ズーム (タッチ)</td></tr>
        <tr><td>クリック</td><td>マスの情報</td></tr>
        <tr><td>?</td><td>この一覧</td></tr>
      </table>
      <p>URL の ?seed= を共有すると同じ地形から始まります。</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
