<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>箱庭都市</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="minimap" title="クリックで移動 (M で表示切替)"></canvas>
    <div id="hud">
      <span id="hud-town"></span>
      <span id="hud-date"></span>
      <span id="hud-clock"></span>
      <span id="hud-pop"></span>
      <span id="hud-info"></span>
      <span class="spacer"></span>
      <span id="hud-news"></span>
      <button data-speed="0" title="一時停止 (スペース)">❚❚</button>
      <button data-speed="1" class="active" title="x1 (1)">▶</button>
      <button data-speed="4" title="x4 (2)">▶▶</button>
      <button data-speed="16" title="x16 (3)">▶▶▶</button>
      <button data-jump="30" title="1か月進める (J)">+1月</button>
      <button data-jump="90" title="3か月進める (Shift+J)">+3月</button>
      <button data-jump="360" title="1年進める (L)">+1年</button>
      <button id="btn-sound" title="環境音">♪ OFF</button>
      <button id="btn-reset" title="新しい街を始める">RESET</button>
    </div>
    <div id="help" hidden>
      <h2>操作</h2>
      <table>
        <tr><td>ドラッグ / 矢印 / WASD</td><td>カメラ移動</td></tr>
        <tr><td>ホイール / + / -</td><td>ズーム</td></tr>
        <tr><td>スペース</td><td>一時停止</td></tr>
        <tr><td>1 / 2 / 3</td><td>速度 ▶ / ▶▶ / ▶▶▶</td></tr>
        <tr><td>J / Shift+J / L</td><td>1か月 / 3か月 / 1年 進める</td></tr>
        <tr><td>M</td><td>ミニマップ表示切替</td></tr>
        <tr><td>クリック</td><td>マスの情報</td></tr>
        <tr><td>?</td><td>この一覧</td></tr>
      </table>
      <p>URL の ?seed= を共有すると同じ地形から始まります。</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
